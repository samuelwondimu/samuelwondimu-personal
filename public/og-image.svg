<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <style>
      .serif { font-family: Georgia, 'Times New Roman', serif; }
      .sans  { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- washi paper background -->
  <rect width="1200" height="630" fill="#f4f0e6"/>
  <rect width="1200" height="630" filter="url(#noise)" opacity="0.05"/>

  <!-- hairline frame -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#26221e" stroke-opacity="0.15"/>
  <line x1="40" y1="120" x2="1160" y2="120" stroke="#26221e" stroke-opacity="0.1"/>
  <line x1="40" y1="510" x2="1160" y2="510" stroke="#26221e" stroke-opacity="0.1"/>

  <!-- eyebrow -->
  <text x="600" y="95" text-anchor="middle" class="sans" font-size="16" letter-spacing="10" fill="#9a938b">CURRICULUM VITAE</text>

  <!-- name -->
  <text x="600" y="290" text-anchor="middle" class="serif" font-size="88" font-weight="500" fill="#26221e">Samuel Wondimu</text>
  <text x="600" y="382" text-anchor="middle" class="serif" font-size="88" font-weight="500" fill="#26221e">Woldeyohannes</text>

  <!-- rule + title -->
  <line x1="500" y1="430" x2="560" y2="430" stroke="#c73e1d" stroke-width="2"/>
  <line x1="640" y1="430" x2="700" y2="430" stroke="#c73e1d" stroke-width="2"/>
  <text x="600" y="437" text-anchor="middle" class="sans" font-size="18" letter-spacing="8" fill="#57504a">FULL STACK ENGINEER</text>

  <!-- stack -->
  <text x="600" y="480" text-anchor="middle" class="sans" font-size="17" letter-spacing="4" fill="#9a938b">Next.js · React · TypeScript · AWS · Sanity CMS</text>

  <!-- seal -->
  <g transform="rotate(-3 1010 480)">
    <rect x="960" y="430" width="100" height="100" rx="8" fill="#c73e1d"/>
    <rect x="960" y="430" width="100" height="100" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
    <text x="1010" y="497" text-anchor="middle" class="serif" font-size="46" font-weight="500" fill="#ffffff">SW</text>
  </g>

  <!-- footer -->
  <text x="600" y="555" text-anchor="middle" class="sans" font-size="14" letter-spacing="6" fill="#9a938b">ADDIS ABABA, ETHIOPIA · SAMUELWONDIMU.COM</text>
</svg>
