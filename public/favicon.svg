<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .serif { font-family: Georgia, 'Times New Roman', serif; }
  </style>
  <!-- washi paper square -->
  <rect width="64" height="64" rx="14" fill="#f4f0e6"/>
  <!-- vermilion seal, slightly rotated -->
  <g transform="rotate(-4 32 32)">
    <rect x="8" y="8" width="48" height="48" rx="7" fill="#c73e1d"/>
    <rect x="8" y="8" width="48" height="48" rx="7" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="2.5"/>
    <text x="32" y="44" text-anchor="middle" class="serif" font-size="27" font-weight="600" letter-spacing="1" fill="#ffffff">SW</text>
  </g>
</svg>
